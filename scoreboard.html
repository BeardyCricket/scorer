<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Beardy Cricket — Scoreboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#1a4a2e;color:#fff;
  display:flex;flex-direction:column;
  transition:background .8s ease;
  user-select:none;
}

/* ── Waiting state ── */
#screen-wait{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:2vh;text-align:center;padding:5vw;
}
.wait-icon{font-size:8vw}
.wait-title{font-size:4vw;font-weight:800;opacity:.9}
.wait-sub{font-size:2vw;opacity:.5;max-width:40vw;line-height:1.6}
.preview-btn{
  margin-top:2vh;font-size:1.4vw;font-weight:700;
  color:rgba(255,255,255,.35);background:none;border:none;
  cursor:pointer;letter-spacing:.06em;text-decoration:underline;
  text-underline-offset:.3em;padding:.5vh 1vw;
}
.preview-btn:hover{color:rgba(255,255,255,.65);}

/* ── Demo bar ── */
#demo-bar{
  display:none;position:fixed;top:0;left:0;right:0;z-index:99;
  background:rgba(0,0,0,.55);backdrop-filter:blur(6px);
  padding:.8vh 2vw;align-items:center;gap:1.2vw;
}
.demo-badge{font-size:1vw;font-weight:900;letter-spacing:.12em;color:#fbbf24;text-transform:uppercase;flex-shrink:0;}
#demo-scene-label{font-size:1vw;opacity:.7;flex:1;text-align:left;}
.demo-nav-btn{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:1.2vw;font-weight:800;cursor:pointer;border-radius:.5vw;padding:.3vh .9vw;flex-shrink:0;}
.demo-nav-btn:hover{background:rgba(255,255,255,.32);}
#demo-counter{font-size:1vw;opacity:.6;flex-shrink:0;}
.demo-exit-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.7);font-size:.9vw;font-weight:700;cursor:pointer;border-radius:.5vw;padding:.3vh 1vw;flex-shrink:0;letter-spacing:.04em;}
.demo-exit-btn:hover{background:rgba(255,255,255,.22);color:#fff;}

/* ── Live scoreboard — landscape two-panel ── */
#screen-live{
  flex:1;display:none;flex-direction:row;
}

/* LEFT: score fills the panel */
#panel-score{
  width:48%;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
#score-number{
  font-weight:900;line-height:.88;
  letter-spacing:-.04em;
  color:rgba(255,255,255,.96);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
  /* font-size set dynamically by JS */
}

/* RIGHT: info panel */
#panel-info{
  width:52%;
  display:flex;flex-direction:column;
  justify-content:space-between;
  padding:4vh 4vw 3.5vh 3vw;
  background:rgba(0,0,0,.2);
  overflow:hidden;
}

/* Players (top of right panel) */
#pair-players{
  font-weight:800;
  letter-spacing:.02em;
  line-height:1.1;
  /* font-size set by JS */
}
/* Finished state subtitle (e.g. "Wins") */
#pair-label{
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.12em;
  opacity:.7;
  margin-top:.8vh;
  /* font-size set by JS */
}

/* Equation — hero of the right panel */
#info-eq{
  flex:1;display:flex;flex-direction:column;
  justify-content:center;gap:.5vh;
}
#eq-label{
  font-weight:800;text-transform:uppercase;
  letter-spacing:.16em;opacity:.5;
  /* font-size set by JS */
}
#eq-value{
  font-weight:900;line-height:.88;
  letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
  /* font-size set by JS */
}
#eq-desc{
  font-weight:700;opacity:.65;
  line-height:1.3;
  /* font-size set by JS */
}

/* Bottom bar */
#info-bottom{
  display:flex;align-items:flex-end;
  justify-content:space-between;gap:2vw;
}
.bc-brand{
  display:flex;align-items:center;gap:.5vw;
  font-weight:700;opacity:.3;
  text-transform:uppercase;letter-spacing:.1em;
  flex-shrink:0;
  font-size:1.1vw;
}
.live-dot{
  width:.75vw;height:.75vw;border-radius:50%;
  background:#4ade80;flex-shrink:0;
  animation:pulse 1.6s ease-in-out infinite;
}
.live-dot.offline{background:#f87171;animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
#match-status{
  font-weight:700;opacity:.4;letter-spacing:.03em;
  text-align:center;flex:1;
  font-size:1.5vw;
}

/* Rival box */
#rival-box{
  border-radius:1.2vw;
  padding:1.2vw 2vw;
  text-align:center;
  flex-shrink:0;
  border:2px solid rgba(255,255,255,.22);
  transition:background .8s ease;
}
#rival-label{font-weight:800;text-transform:uppercase;letter-spacing:.12em;opacity:.6;font-size:1vw;margin-bottom:.3vw;}
#rival-score{font-weight:900;line-height:1;letter-spacing:-.03em;font-size:4.5vw;}
#rival-name{font-weight:700;opacity:.52;margin-top:.3vw;font-size:1.1vw;}

/* Fullscreen button */
#fs-btn{
  position:fixed;bottom:1.2vh;right:.8vw;
  background:none;border:none;color:rgba(255,255,255,.2);
  font-size:1.8vw;cursor:pointer;z-index:10;padding:.3vh .4vw;
}
#fs-btn:hover{color:rgba(255,255,255,.55);}
</style>
</head>
<body>

<div id="demo-bar">
  <span class="demo-badge">Preview</span>
  <span id="demo-scene-label"></span>
  <button class="demo-nav-btn" onclick="demoNav(-1)">&#8592;</button>
  <span id="demo-counter"></span>
  <button class="demo-nav-btn" onclick="demoNav(1)">&#8594;</button>
  <button class="demo-exit-btn" onclick="exitDemo()">&#x2715; Exit preview</button>
</div>

<div id="screen-wait">
  <div class="wait-icon">🏏</div>
  <div class="wait-title">Waiting for match…</div>
  <div class="wait-sub">The scoreboard updates live when a match starts. No need to refresh.</div>
  <button class="preview-btn" onclick="startDemo()">Preview scoreboard</button>
</div>

<div id="screen-live">
  <div id="panel-score">
    <div id="score-number">—</div>
  </div>
  <div id="panel-info">
    <div>
      <div id="pair-players">—</div>
      <div id="pair-label"></div>
    </div>
    <div id="info-eq">
      <div id="eq-label"></div>
      <div id="eq-value"></div>
      <div id="eq-desc"></div>
    </div>
    <div id="info-bottom">
      <div class="bc-brand">
        <div class="live-dot" id="live-dot"></div>
        Beardy Cricket
      </div>
      <div id="match-status"></div>
      <div id="rival-box" style="display:none">
        <div id="rival-label">vs</div>
        <div id="rival-score">—</div>
        <div id="rival-name"></div>
      </div>
    </div>
  </div>
</div>

<button id="fs-btn" onclick="toggleFullscreen()" title="Toggle fullscreen">&#x26F6;</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
'use strict';

const SUPABASE_URL = 'https://gdhqqcqzshvomnyfhsya.supabase.co';
const SUPABASE_KEY = 'sb_publishable_tYpM6ALOCT5Y39VjoKpSOw_QdL-K4Kv';
const { createClient } = supabase;
const client = createClient(SUPABASE_URL, SUPABASE_KEY);

const params   = new URLSearchParams(window.location.search);
let matchId    = params.get('match') || null;
let channel    = null;
let resetTimer = null;
let _lastScore = null;

const BG = {
  purple:'#6d28d9', blue:'#1d4ed8', grey:'#374151',
  red:'#b91c1c',   green:'#166534', orange:'#c2410c', pink:'#9d174d'
};
function bg(c){ return BG[c] || '#1a4a2e'; }

function isFinished(p){
  return p.status === 'finished' ||
    (p.over >= p.total_overs && p.total_overs > 0 && p.ball >= 6);
}
function setConnected(ok){
  document.getElementById('live-dot').classList.toggle('offline', !ok);
}

// ── Text fitting ──────────────────────────────────────────
// Binary-search the largest font-size that fits within maxW × maxH (px).
function fitText(el, maxW, maxH, maxPx){
  if(!el || maxW <= 0 || maxH <= 0) return;
  let lo = 8, hi = maxPx || 800;
  el.style.fontSize = hi + 'px';
  // Quick path — already fits
  if(el.scrollWidth <= maxW && el.offsetHeight <= maxH){ return; }
  while(hi - lo > 2){
    const mid = (lo + hi) >> 1;
    el.style.fontSize = mid + 'px';
    (el.scrollWidth <= maxW && el.offsetHeight <= maxH) ? (lo = mid) : (hi = mid);
  }
  el.style.fontSize = lo + 'px';
}

function setScore(val){
  _lastScore = val;
  const el     = document.getElementById('score-number');
  const panel  = document.getElementById('panel-score');
  if(!el || !panel) return;
  el.textContent = val;
  fitText(el, panel.clientWidth * 0.94, panel.clientHeight * 0.9, 900);
}

function setSizes(){
  // Right panel text sizing relative to panel height
  const ph = document.getElementById('panel-info')?.clientHeight || window.innerHeight;
  const s  = id => document.getElementById(id);
  if(s('pair-players')) s('pair-players').style.fontSize = Math.round(ph * 0.075) + 'px';
  if(s('pair-label'))   s('pair-label').style.fontSize   = Math.round(ph * 0.038) + 'px';
  if(s('eq-label'))     s('eq-label').style.fontSize     = Math.round(ph * 0.032) + 'px';
  if(s('eq-desc'))      s('eq-desc').style.fontSize      = Math.round(ph * 0.065) + 'px';
}

function setEquation(label, value, desc){
  const s = id => document.getElementById(id);
  if(s('eq-label')) s('eq-label').textContent = label;
  if(s('eq-desc'))  s('eq-desc').textContent  = desc;
  const el    = s('eq-value');
  const panel = document.getElementById('panel-info');
  if(!el || !panel) return;
  el.textContent = value;
  // Fit within 90% panel width, 40% panel height
  fitText(el, panel.clientWidth * 0.9, panel.clientHeight * 0.4, 600);
}

window.addEventListener('resize', () => {
  setSizes();
  if(_lastScore !== null) setScore(_lastScore);
});

// ── Render ────────────────────────────────────────────────
function render(payload){
  if(!payload) return;
  const bi    = payload.batting;
  const pairs = payload.pairs || [];
  const done  = isFinished(payload);

  if(done){
    const sorted = [...pairs].sort((a,b) => b.total - a.total);
    const winner = sorted[0];
    if(!winner){ showWait(); return; }

    showLive(winner.color);
    setSizes();
    set('pair-players', (winner.players||[]).join(' & '));
    set('pair-label', 'WINS 🏆');
    setScore(winner.total);
    set('match-status', 'Match complete · ' + payload.total_overs + ' overs');

    if(sorted.length > 1){
      const second = sorted[1];
      const margin = winner.total - second.total;
      setEquation('WON BY', margin, 'run' + (margin !== 1 ? 's' : ''));
      showRivalBox(second.color, second.total, (second.players||[]).join(' & '), '2nd');
    } else {
      setEquation('', '', '');
      hide('rival-box');
    }

    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => {
      matchId = null; showWait(); subscribeForAny();
    }, 60000);
    return;
  }

  clearTimeout(resetTimer); resetTimer = null;
  if(!bi){ showWait(); return; }

  showLive(bi.color);
  setSizes();
  set('pair-players', (bi.players||[]).join(' & '));
  set('pair-label', '');
  setScore(bi.total);

  const ov = payload.over, ball = payload.ball;
  set('match-status', ball >= 6 ? `End of over ${ov}` : `Over ${ov} · Ball ${ball}`);

  const ovsBatted  = Math.floor(bi.balls_faced / 6);
  const ballsExtra = bi.balls_faced % 6;
  const rivals     = pairs.filter(p => p.color !== bi.color && p.total > 0);

  if(!rivals.length){
    setEquation('', `${ovsBatted}.${ballsExtra}`, 'overs batted');
    hide('rival-box');
  } else {
    const target      = Math.max(...rivals.map(p => p.total));
    const runsNeeded  = target + 1 - bi.total;
    const ballsPerPair = pairs.length > 0
      ? Math.round((payload.total_overs / pairs.length) * 6) : 24;
    const ballsLeft   = Math.max(0, ballsPerPair - bi.balls_faced);
    const ballWord    = 'ball' + (ballsLeft !== 1 ? 's' : '');

    const allRanked = [...pairs].sort((a,b) => b.total - a.total);

    if(runsNeeded > 0){
      setEquation('NEED', runsNeeded, `off ${ballsLeft} ${ballWord} to lead`);
      const leader = allRanked.find(p => p.color !== bi.color && p.total > 0);
      if(leader) showRivalBox(leader.color, leader.total, (leader.players||[]).join(' & '), 'To beat');
      else hide('rival-box');
    } else {
      const ahead = bi.total - target;
      setEquation('LEADING BY', ahead, `${ballsLeft} ${ballWord} remaining`);
      const rival = allRanked.find(p => p.color !== bi.color && p.total > 0);
      if(rival) showRivalBox(rival.color, rival.total, (rival.players||[]).join(' & '), '2nd');
      else hide('rival-box');
    }
  }
}

// ── UI helpers ────────────────────────────────────────────
function set(id, text){ const el = document.getElementById(id); if(el) el.textContent = text; }
function hide(id){ const el = document.getElementById(id); if(el) el.style.display = 'none'; }

function showWait(){
  document.getElementById('screen-wait').style.display = 'flex';
  document.getElementById('screen-live').style.display = 'none';
  document.body.style.background = '#1a4a2e';
}
function showLive(color){
  document.getElementById('screen-wait').style.display = 'none';
  document.getElementById('screen-live').style.display = 'flex';
  document.body.style.background = bg(color);
}
function showRivalBox(color, score, name, label){
  const box = document.getElementById('rival-box');
  if(!box) return;
  box.style.display    = 'block';
  box.style.background = bg(color);
  set('rival-label', label);
  set('rival-score', score);
  set('rival-name',  name);
}
function toggleFullscreen(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen().catch(()=>{});
}

// ── Supabase ──────────────────────────────────────────────
function subscribeToMatch(id){
  if(channel) client.removeChannel(channel);
  channel = client
    .channel('scoreboard-' + id)
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'live_scores', filter: `match_id=eq.${id}` },
      msg => { if(msg.new?.payload) render(msg.new.payload); })
    .subscribe(s => setConnected(s === 'SUBSCRIBED'));
}
function subscribeForAny(){
  if(channel) client.removeChannel(channel);
  channel = client
    .channel('scoreboard-any')
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'live_scores' },
      msg => {
        const p = msg.new?.payload;
        if(!p || isFinished(p)) return;
        if(!matchId){ matchId = msg.new.match_id; render(p); subscribeToMatch(matchId); }
      })
    .subscribe(s => setConnected(s === 'SUBSCRIBED'));
}
async function init(){
  try { if('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch(e){}
  if(matchId){
    const { data } = await client.from('live_scores').select('payload').eq('match_id', matchId).maybeSingle();
    if(data?.payload) render(data.payload);
    subscribeToMatch(matchId);
  } else {
    const { data } = await client.from('live_scores').select('match_id,updated_at,payload')
      .order('updated_at', { ascending: false }).limit(10);
    const live = (data||[]).filter(r => r.payload && !isFinished(r.payload) && !r.match_id.startsWith('beardy-test-'));
    if(live.length){ matchId = live[0].match_id; render(live[0].payload); subscribeToMatch(matchId); }
    else subscribeForAny();
  }
}
document.addEventListener('visibilitychange', async () => {
  if(document.visibilityState === 'visible')
    try { if('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch(e){}
});

// ── Demo mode ─────────────────────────────────────────────
const DEMO_SCENARIOS = [
  {
    _label: 'First pair batting — no target yet',

    pairs:[
      {color:'purple',cname:'Purple',players:['Tom','Andy'],  total:47,idx:0},

      {color:'red',   cname:'Red',   players:['Dave','Pete'], total:0, idx:2},

    ],
    over:3,ball:2,total_overs:16
  },
  {
    _label: 'Chasing a target',
    batting:{color:'blue',cname:'Blue',players:['Sam','Chris'],total:23,balls_faced:9},
    pairs:[
      {color:'purple',cname:'Purple',players:['Tom','Andy'],  total:47,idx:0},
      {color:'blue',  cname:'Blue',  players:['Sam','Chris'], total:23,idx:1},
      {color:'red',   cname:'Red',   players:['Dave','Pete'], total:0, idx:2},
      {color:'green', cname:'Green', players:['Ed','Nick'],   total:0, idx:3},
    ],
    over:5,ball:4,total_overs:16
  },
  {
    _label: 'Leading',
    batting:{color:'blue',cname:'Blue',players:['Sam','Chris'],total:54,balls_faced:18},
    pairs:[
      {color:'purple',cname:'Purple',players:['Tom','Andy'],  total:47,idx:0},
      {color:'blue',  cname:'Blue',  players:['Sam','Chris'], total:54,idx:1},
      {color:'red',   cname:'Red',   players:['Dave','Pete'], total:0, idx:2},
      {color:'green', cname:'Green', players:['Ed','Nick'],   total:0, idx:3},
    ],
    over:6,ball:1,total_overs:16
  },
  {
    _label: '3-digit score',
    batting:{color:'orange',cname:'Orange',players:['Jake','Liam'],total:112,balls_faced:22},
    pairs:[
      {color:'purple',cname:'Purple',players:['Tom','Andy'],  total:87, idx:0},
      {color:'blue',  cname:'Blue',  players:['Sam','Chris'], total:72, idx:1},
      {color:'red',   cname:'Red',   players:['Dave','Pete'], total:65, idx:2},
      {color:'orange',cname:'Orange',players:['Jake','Liam'], total:112,idx:3},
    ],
    over:7,ball:3,total_overs:16
  },
  {
    _label: 'Match finished',
    status:'finished',batting:null,
    pairs:[
      {color:'purple',cname:'Purple',players:['Tom','Andy'],  total:89,idx:0},
      {color:'blue',  cname:'Blue',  players:['Sam','Chris'], total:76,idx:1},
      {color:'red',   cname:'Red',   players:['Dave','Pete'], total:61,idx:2},
      {color:'green', cname:'Green', players:['Ed','Nick'],   total:54,idx:3},
    ],
    over:16,ball:6,total_overs:16
  },
];
let demoActive = false, demoIdx = 0;
function startDemo(idx){
  demoActive = true; demoIdx = idx || 0;
  clearTimeout(resetTimer); resetTimer = null;
  document.getElementById('demo-bar').style.display = 'flex';
  renderDemo();
}
function renderDemo(){
  const s = DEMO_SCENARIOS[demoIdx];
  document.getElementById('demo-scene-label').textContent = s._label;
  document.getElementById('demo-counter').textContent = `${demoIdx+1} / ${DEMO_SCENARIOS.length}`;
  render(s);
}
function demoNav(dir){
  demoIdx = (demoIdx + dir + DEMO_SCENARIOS.length) % DEMO_SCENARIOS.length;
  renderDemo();
}
function exitDemo(){
  demoActive = false;
  document.getElementById('demo-bar').style.display = 'none';
  showWait();
}

window.addEventListener('DOMContentLoaded', () => {
  if(params.get('demo') === '1') startDemo();
  else init();
});
</script>
</body>
</html>
